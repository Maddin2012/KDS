name: Veröffentlichen

on:
  push:
    branches: [main]
  # Von Hand anstoßen – praktisch nach dem Eintragen der Firebase-Secrets.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Firebase-Zugangsdaten eintragen
        # Der Firebase-Web-Schlüssel ist kein Geheimnis (er steht ohnehin in der
        # ausgelieferten Seite), abgesichert wird über firestore.rules.
        # Trotzdem über Secrets, damit die Werte nicht im Repository stehen.
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.FB_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude 'README.md' --exclude 'firestore.rules' --exclude 'tests' --exclude '.gitignore' --exclude 'firebase.json' ./ dist/
          if [ -n "$FB_API_KEY" ] && [ -n "$FB_PROJECT_ID" ]; then
            node -e '
              // Beim Kopieren aus firebaseConfig rutschen oft Anführungszeichen,
              // Kommas oder Leerzeichen mit – die werden hier entfernt.
              const clean = (v) => String(v || "").trim()
                .replace(/^[A-Za-z]+\s*:\s*/, "")      // versehentlich mitkopiert: apiKey:
                .replace(/[,;]+$/, "").trim()
                .replace(/^["\x27`]+|["\x27`]+$/g, "").trim();
              const c = { apiKey: clean(process.env.FB_API_KEY), authDomain: clean(process.env.FB_AUTH_DOMAIN),
                          projectId: clean(process.env.FB_PROJECT_ID), appId: clean(process.env.FB_APP_ID) };
              const errors = [];
              if (!/^AIza[0-9A-Za-z_-]{35}$/.test(c.apiKey))
                errors.push("FB_API_KEY passt nicht: erwartet 39 Zeichen, beginnend mit AIza (hat " + c.apiKey.length + " Zeichen, beginnt mit " + JSON.stringify(c.apiKey.slice(0, 4)) + ")");
              if (!/^[a-z0-9-]+$/.test(c.projectId))
                errors.push("FB_PROJECT_ID passt nicht: nur Kleinbuchstaben, Ziffern und Bindestriche erwartet");
              if (!/\.firebaseapp\.com$/.test(c.authDomain))
                errors.push("FB_AUTH_DOMAIN passt nicht: erwartet …firebaseapp.com");
              // Form eines Wertes zeigen, ohne ihn preiszugeben: Ziffern → 9, Buchstaben → a
              const shape = (v) => v.replace(/[0-9]/g, "9").replace(/[A-Za-z]/g, "a");
              if (!/^\d+:\d+:web:[0-9A-Za-z]+$/.test(c.appId))
                errors.push("FB_APP_ID passt nicht: erwartet die Form 9:999999999999:web:aaaa… – eingetragen ist die Form " + JSON.stringify(shape(c.appId)) + " (" + c.appId.length + " Zeichen)");
              if (errors.length) { errors.forEach(e => console.log("::error::" + e)); process.exit(1); }
              require("fs").writeFileSync("dist/config.js", "window.KDS_FIREBASE_CONFIG = " + JSON.stringify(c) + ";\n");'
            echo "Firebase-Zugangsdaten geprüft und eingetragen."
          else
            echo "::warning::Keine Firebase-Secrets gefunden – die App läuft im Probemodus (nur ein Gerät)."
          fi
          # Versionsstand für die Anzeige in der App (Seitenleiste unten)
          echo "window.KDS_BUILD = { sha: \"${GITHUB_SHA::7}\", time: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" };" >> dist/config.js
          # Dateinamen mit Version versehen (config.js?v=…): Jede Veröffentlichung ist für
          # den Browser eine neue Datei – keine alte Kopie aus irgendeinem Zwischenspeicher.
          V=${GITHUB_SHA::8}
          sed -i -E "s#(src|href)=\"(config\.js|styles\.css|app\.js)\"#\1=\"\2?v=$V\"#g" dist/index.html
          sed -i -E "s#from '\./(data|store-local)\.js'#from './\1.js?v=$V'#g; s#import\('\./store-firebase\.js'\)#import('./store-firebase.js?v=$V')#g" dist/app.js dist/store-firebase.js
          grep -q "config.js?v=$V" dist/index.html && grep -q "data.js?v=$V" dist/app.js && grep -q "store-firebase.js?v=$V" dist/app.js \
            || { echo "::error::Versionierung der Dateinamen fehlgeschlagen"; exit 1; }
          # Neue Version → Service Worker lädt alle Dateien neu
          sed -i "s/const VERSION = 'kds-v1';/const VERSION = 'kds-${GITHUB_SHA::8}';/" dist/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Firebase-Sicherheitsregeln automatisch einspielen – nur wenn das Secret
  # FB_SERVICE_ACCOUNT (Dienstkonto-Schlüssel als JSON) hinterlegt ist.
  # Schlägt das Einspielen fehl, wird auch die App nicht veröffentlicht,
  # damit App und Regeln nie auseinanderlaufen.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Firestore-Regeln einspielen
        env:
          FB_SERVICE_ACCOUNT: ${{ secrets.FB_SERVICE_ACCOUNT }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          if [ -z "$FB_SERVICE_ACCOUNT" ]; then
            echo "::warning::Secret FB_SERVICE_ACCOUNT fehlt – Firestore-Regeln bitte von Hand in der Firebase-Konsole einfügen."
            exit 0
          fi
          printf '%s' "$FB_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          PID=$(node -e 'const c=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(c.project_id||"")' "$RUNNER_TEMP/sa.json")
          PID=${PID:-$FB_PROJECT_ID}
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@14.27.0 deploy --only firestore:rules --project "$PID" --non-interactive > "$RUNNER_TEMP/fb.log" 2>&1
          RC=$?
          set -e
          rm -f "$RUNNER_TEMP/sa.json"
          cat "$RUNNER_TEMP/fb.log"
          if [ $RC -ne 0 ]; then
            # Fehlermeldung als Hinweis sichtbar machen (enthält keine Schlüssel)
            grep -iE "error|denied|permission|not enabled|required|403|404" "$RUNNER_TEMP/fb.log" | head -8 | while IFS= read -r line; do
              echo "::error::Firebase: ${line:0:300}"
            done
            echo "::error::Projekt: $PID"
            exit $RC
          fi

  deploy:
    needs: [build, rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
